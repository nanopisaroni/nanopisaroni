<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Libros que quiero — Leandro Pisaroni</title>
  <meta name="description" content="Los libros que quiero, con portada, breve reseña y link para comprarlos. Si me querés regalar algo, cualquiera de esta lista es un acierto.">
  <meta property="og:title" content="Libros que quiero — Leandro Pisaroni">
  <meta property="og:description" content="Los libros que quiero, con portada y link para comprar. Cualquiera de esta lista es un acierto.">
  <meta property="og:type" content="website">
  <link rel="stylesheet" href="style.css">
  <script>window.va=window.va||function(){(window.vaq=window.vaq||[]).push(arguments)};</script><script defer src="/_vercel/insights/script.js"></script>
  <style>
    /* ── Libros que quiero: vitrina ancha, densa, pensada para el celular ── */
    .site.ancho { width: min(100% - 48px, 1320px); }

    h1.qh {
      font-family: var(--font-display);
      font-size: clamp(28px, 5vw, 40px);
      font-weight: 600;
      font-variation-settings: 'opsz' 72;
      letter-spacing: -0.02em;
      line-height: 1.08;
      margin: 6px 0 26px;
    }

    .grid {
      display: grid;
      gap: 30px 18px;
      grid-template-columns: repeat(auto-fill, minmax(146px, 1fr));
      align-items: stretch;
    }
    @media (min-width: 560px)  { .grid { grid-template-columns: repeat(auto-fill, minmax(176px, 1fr)); gap: 32px 20px; } }
    @media (min-width: 1000px) { .grid { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 36px 24px; } }

    .bk { display: flex; flex-direction: column; min-width: 0; }

    .bk .cover {
      display: block;
      width: 100%;
      aspect-ratio: 2 / 3;
      border-radius: 3px;
      overflow: hidden;
      background: var(--rule-light);
      box-shadow: 0 2px 10px rgba(28,25,23,.18);
      transition: transform .18s ease, box-shadow .18s ease;
    }
    .bk .cover:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(28,25,23,.22); }
    .bk .cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .bk .cover.vacia { display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 10px rgba(28,25,23,.12); border: 1px solid var(--rule); }
    .bk .cover.vacia span {
      font-family: var(--font-display);
      font-size: 13px;
      line-height: 1.3;
      color: var(--text-muted);
      padding: 14px;
      text-align: center;
    }

    .bk .info { display: flex; flex-direction: column; flex: 1 1 auto; padding-top: 10px; }

    .bk h3 {
      font-family: var(--font-display);
      font-size: 15px;
      font-weight: 600;
      font-variation-settings: 'opsz' 30;
      letter-spacing: -0.01em;
      line-height: 1.24;
      margin: 0 0 3px;
    }
    .bk h3 .orig { font-weight: 400; font-size: 12px; color: var(--text-faint); }
    .bk .autor {
      font-size: 11.5px;
      color: var(--text-muted);
      line-height: 1.35;
      margin: 0 0 7px;
    }
    .bk .brief {
      font-size: 12px;
      line-height: 1.45;
      color: #57534e;
      margin: 0 0 10px;
      display: -webkit-box;
      -webkit-line-clamp: 5;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .comprar { display: flex; flex-direction: column; gap: 6px; margin-top: auto; }
    .comprar a {
      display: block;
      text-decoration: none;
      font-size: 11.5px;
      font-weight: 500;
      padding: 7px 9px;
      border-radius: 6px;
      border: 1px solid var(--rule);
      color: var(--text);
      background: var(--surface);
      line-height: 1.3;
      transition: all .15s ease;
    }
    .comprar a:hover { border-color: var(--accent); color: var(--accent); }
    .comprar a.primario { background: var(--text); border-color: var(--text); color: #faf7f2; }
    .comprar a.primario:hover { background: var(--accent); border-color: var(--accent); color: #fff; }
    .comprar a .precio { display: block; font-size: 10px; opacity: .7; font-weight: 400; margin-top: 1px; }

    .nota-precios {
      margin: 40px 0 0;
      font-size: 12px;
      color: var(--text-faint);
      text-align: center;
    }
    #fallback { font-size: 14px; color: var(--text-muted); }
  </style>
</head>
<body>
  <div class="site ancho">
    <header>
      <a href="index.html" class="site-title">Leandro Pisaroni</a>
      <nav>
        <a href="essays.html">Essays</a>
        <a href="ideas.html">Ideas</a>
        <a href="panteon.html">Panteón</a>
        <a href="libros.html">Libros</a>
        <a href="quiero.html" class="active">Quiero</a>
        <a href="buy.html">Buy</a>
        <a href="about.html">About</a>
      </nav>
    </header>

    <main>
      <h1 class="qh">Libros que quiero</h1>
      <div class="grid" id="grid">
        <p id="fallback">Cargando…</p>
      </div>
      <p class="nota-precios">Precios de referencia (octubre 2026) — conviene verificar el listado antes de pagar.</p>
    </main>

    <footer>
      &copy; 2026 Leandro Pisaroni &middot; Hecho en Córdoba, Argentina
    </footer>
  </div>

<script>
(async function () {
  var grid = document.getElementById('grid');

  function tarjeta(l) {
    var art = document.createElement('article');
    art.className = 'bk';

    var ops = (l.opciones || []).filter(function (o) { return (o.link || '').indexOf('http') === 0; });
    var principal = ops.filter(function (o) { return o.mercado === 'AR'; })[0] || ops[0] || null;

    var cover = document.createElement(principal ? 'a' : 'div');
    cover.className = 'cover';
    if (principal) {
      cover.href = principal.link;
      cover.target = '_blank';
      cover.rel = 'noopener';
      cover.title = 'Comprar';
    }
    if (l.portada) {
      var img = document.createElement('img');
      img.src = l.portada;
      img.alt = 'Portada de ' + l.titulo;
      img.loading = 'lazy';
      img.onerror = function () {
        cover.className = 'cover vacia';
        cover.removeAttribute('href');
        cover.innerHTML = '<span>' + l.titulo + '</span>';
      };
      cover.appendChild(img);
    } else {
      cover.className = 'cover vacia';
      cover.removeAttribute('href');
      cover.innerHTML = '<span>' + l.titulo + '</span>';
    }

    var info = document.createElement('div');
    info.className = 'info';

    var h = document.createElement('h3');
    h.textContent = l.titulo_es && l.titulo_es !== l.titulo ? l.titulo_es : l.titulo;
    if (l.titulo_es && l.titulo_es !== l.titulo) {
      var orig = document.createElement('span');
      orig.className = 'orig';
      orig.textContent = ' (' + l.titulo + ')';
      h.appendChild(orig);
    }

    var p1 = document.createElement('p');
    p1.className = 'autor';
    p1.textContent = l.autor + (l.anio ? ' · ' + l.anio : '');

    var p2 = document.createElement('p');
    p2.className = 'brief';
    p2.textContent = l.brief;

    var comprar = document.createElement('div');
    comprar.className = 'comprar';
    ops.slice(0, 2).forEach(function (o) {
      var a = document.createElement('a');
      a.href = o.link;
      a.target = '_blank';
      a.rel = 'noopener';
      if (o.mercado === 'AR') a.className = 'primario';
      a.innerHTML = '<span>' + (o.tienda || (o.mercado === 'AR' ? 'Librería argentina' : 'Amazon')) + '</span>' +
                    (o.precio ? '<span class="precio">' + o.precio + '</span>' : '');
      comprar.appendChild(a);
    });

    info.appendChild(h);
    info.appendChild(p1);
    info.appendChild(p2);
    info.appendChild(comprar);
    art.appendChild(cover);
    art.appendChild(info);
    return art;
  }

  try {
    var r = await fetch('quiero-data.json', { cache: 'no-store' });
    var data = await r.json();
    var libros = data.libros || [];
    grid.innerHTML = '';
    libros.forEach(function (l) { grid.appendChild(tarjeta(l)); });
    if (data.actualizado) {
      document.querySelector('.nota-precios').textContent =
        'Precios de referencia (' + data.actualizado + ') — conviene verificar el listado antes de pagar.';
    }
  } catch (e) {
    grid.innerHTML = '<p id="fallback">No se pudo cargar la lista. Escribime y te paso los títulos a mano.</p>';
  }
})();
</script>
</body>
</html>
